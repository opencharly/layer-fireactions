# The fireactions layer: the pinned v2.0.8-oc1 build from the opencharly fork, and the contract that makes it
# a POOL HOST rather than just a binary.
#
# The ref is a TAG on the FORK, not upstream's v2.0.8: the fork carries the containerd-snapshotter
# configurability this integration needs (a host with no devmapper device must be able to run pools), and a
# tag — not a branch — is the immutable pin Policy B asks for. Measured: the fork's main is four commits
# ahead of upstream's tag, and `cmd/fireactions/main.go` is among the changed files.
#
# The build is upstream's own invocation — `go build ./cmd/fireactions` — with the tag stamped in through
# ldflags, so the running binary can say which source it came from.
layer-fireactions:
    candy:
        description: |
            Fireactions, built from the pinned opencharly fork at v2.0.8-oc1, with the containerd
            snapshotter configuration this substrate needs so a host without a devmapper device can still
            run pools. Installs the binary, and hands the running contract — config, unit, pool probe — to
            the bed that asserts it.
            
            HOSTING A RUNNING SERVICE: this candy declares `service: fireactions`. On a machine venue its
            systemd unit is written and enabled only when the CONSUMER's deploy sets
            `install_opts: with_service: true` - the same gate `distro-cachyos` and `box/cachyos` set for
            sddm, and the org-wide way for a consumer to say it wants a service actually enabled. A
            consumer that omits it still gets the binary, the rendered config and the pool CLI, but no
            enabled unit. The bed in this repo sets it, so it exercises the documented consumer path.
        distro:
            fedora:
                package:
                    - golang
                    - git
            arch:
                package:
                    - go
                    - git
        secret_accept:
          - name: FIREACTIONS_APP_PRIVATE_KEY
            description: >-
                The GitHub App private key fireactions uses to register runners. Supplied here rather
                than baked into the config, so a deployment without it fails visibly instead of
                shipping a placeholder App key.
            key: charly/fireactions/app-private-key
        service:
            # ONE entry, because the init system picks the form: systemd renders a unit from the exec, and
            # supervisord a program. The exec is a CHARLY-OWNED START SCRIPT rather than the binary itself,
            # because the App key is a deploy-time credential the image cannot know: the script injects it
            # from the environment `secret_accept:` provides, then execs `fireactions server --config <path>`.
            - name: fireactions
              exec: /usr/local/bin/start-fireactions.sh
        plan:
            - run: write the ONE renderer that both the service and the bed's config check invoke (R2)
              id: fireactions-render-script
              write: /usr/local/bin/render-fireactions-config.sh
              mode: "0755"
              run_as: root
              content: |
                  #!/bin/bash
                  set -eu
                  # Render a fireactions config that carries the App key from one that does not.
                  #
                  # THE single implementation of that render. The service's start script and the bed's config
                  # check both call THIS script, so the check exercises the real renderer and cannot drift from
                  # it (R2: one canonical implementation, extracted on the second occurrence).
                  #
                  # usage: render-fireactions-config.sh <src-config> <dst-config>
                  #
                  # With FIREACTIONS_APP_PRIVATE_KEY set the operator's key is written in as-is. With it unset a
                  # THROWAWAY RSA key is generated so the server starts and the unit is assertable; it will not
                  # register runners. R8: the boundary runs live when the credential is there and says so
                  # visibly when it is not - never a baked placeholder that parses and then dies.
                  src="$1"
                  dst="$2"
                  key="${FIREACTIONS_APP_PRIVATE_KEY:-}"
                  if [ -z "$key" ]; then
                      key=$(openssl genrsa 2048 2>/dev/null)
                  fi
                  sed '/^  app_private_key:/d' "$src" > "$dst"
                  {
                      printf '  app_private_key: |\n'
                      printf '%s\n' "$key" | sed 's/^/    /'
                  } >> "$dst"
            - run: write the charly-owned start script that injects the App key at runtime
              id: fireactions-start-script
              write: /usr/local/bin/start-fireactions.sh
              mode: "0755"
              run_as: root
              content: |
                #!/bin/bash
                set -eu
                # R2: the render lives in ONE place - /usr/local/bin/render-fireactions-config.sh - which the
                # bed's config check ALSO calls, so the check exercises the real renderer rather than a copy.
                # This script used to carry a copy of that logic; it no longer does.
                #
                # The renderer injects the key `secret_accept:` provides, or a THROWAWAY RSA key when none is
                # supplied, so the server starts and the unit is assertable (it cannot register runners). R8:
                # the boundary runs live when the credential is there and says so visibly when it is not. The
                # bed asserts the unit and FAILS when it is absent; it never skips.
                src=/etc/fireactions/config.yaml
                dst=/etc/fireactions/config.yaml.rendered
                /usr/local/bin/render-fireactions-config.sh "$src" "$dst"
                mv "$dst" "$src"
                chmod 0640 "$src"
                exec fireactions server --config "$src"
            - run: fetch the pinned source from the opencharly fork
              id: fireactions-source
              download: "https://github.com/opencharly/fireactions/archive/refs/tags/v2.0.8-oc1.tar.gz"
              extract: tar.gz
              to: /opt/fireactions-src
              run_as: root
            - run: build it with the tag stamped in, the way upstream builds it
              id: fireactions-build
              run_as: root
              command: |
                set -eu
                cd /opt/fireactions-src/fireactions-*
                go build -trimpath -ldflags "-s -w -X main.version=v2.0.8-oc1" -o /usr/local/bin/fireactions ./cmd/fireactions
            - check: the binary is installed and answers
              id: fireactions-installed
              command: test -x /usr/local/bin/fireactions && fireactions --help >/dev/null
            - run: render the server configuration fireactions will read
              id: fireactions-config
              write: /etc/fireactions/config.yaml
              mode: "0640"
              run_as: root
              content: |
                # Written by the charly fireactions layer. The shape is the fork's own testdata, VERIFIED
                # against the real binary: `fireactions validate <file>` answers "is valid" for exactly this
                # document (measured while building this layer), and `fireactions pools list` is the probe
                # the bed uses - it fails visibly with a connection error when no server is running, which is
                # the skip case the ledger asks for rather than a silent pass.
                #
                # The App key is NOT baked here. It is injected at deploy time by `secret_accept:` below,
                # and the start script writes it into this file at runtime - an image cannot know a credential.
                bind_address: 0.0.0.0:8080
                metrics:
                  enabled: true
                  address: 127.0.0.1:8081

                github:
                  app_id: 1
                  app_private_key: ""

                pools:
                - name: charly-check
                  replicas: 0
                  runner:
                    name: charly-check
                    image: ghcr.io/hostinger/fireactions/runner:ubuntu-20.04-x64-2.310.2
                    image_pull_policy: IfNotPresent
                    group_id: 1
                    organization: opencharly
                    labels: [self-hosted, charly-check]
                  firecracker:
                    binary_path: /usr/local/bin/firecracker
            - check: the configuration this layer rendered is one fireactions accepts
              id: fireactions-config-valid
              command: fireactions validate /etc/fireactions/config.yaml
            - check: the source the binary was built from is the fork, not upstream
              id: fireactions-source-is-the-fork
              command: grep -rq "devmapper\|snapshotter" /opt/fireactions-src/fireactions-*/cmd/fireactions/main.go










